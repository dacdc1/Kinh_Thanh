version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # 1. Cơ sở dữ liệu PostgreSQL 16
  # ----------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: kinhthanh_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kinhthanh_db}
      POSTGRES_USER: ${POSTGRES_USER:-kinhthanh_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kinhthanh_secure_password_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kinhthanh_user} -d ${POSTGRES_DB:-kinhthanh_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # 2. Ứng dụng Web Django (Gunicorn + Whitenoise)
  # ----------------------------------------------------------------------------
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: kinhthanh_web
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.docker
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media

volumes:
  postgres_data:
    name: kinhthanh_postgres_data
  static_volume:
    name: kinhthanh_static_volume
  media_volume:
    name: kinhthanh_media_volume
