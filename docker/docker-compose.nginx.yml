version: '3.8'

services:
  # 1. PostgreSQL 16
  db:
    image: postgres:16-alpine
    container_name: kinhthanh_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kinhthanh_db}
      POSTGRES_USER: ${POSTGRES_USER:-kinhthanh_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kinhthanh_secure_password_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kinhthanh_user} -d ${POSTGRES_DB:-kinhthanh_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Django Gunicorn App
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: kinhthanh_web
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.docker
    expose:
      - "8000"
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media

  # 3. Nginx Reverse Proxy (Port 80)
  nginx:
    image: nginx:1.25-alpine
    container_name: kinhthanh_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    depends_on:
      - web

volumes:
  postgres_data:
    name: kinhthanh_postgres_data
  static_volume:
    name: kinhthanh_static_volume
  media_volume:
    name: kinhthanh_media_volume
